model: yolo26n.pt
data: configs/data_yolo.yaml

imgsz: 640
epochs: 100
batch: 8
seed: 42
optimizer: SGD
lr0: 0.005
patience: 50

# Online augmentation during training only
mosaic: 1.0
mixup: 0.0
copy_paste: 0.0
degrees: 5.0
translate: 0.10
scale: 0.30
shear: 0.0
perspective: 0.0
fliplr: 0.5
flipud: 0.0
hsv_h: 0.015
hsv_s: 0.20
hsv_v: 0.20
