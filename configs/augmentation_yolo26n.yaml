# YOLO26n online augmentation modes for training only.
# Validation and test data must never be augmented.
#
# Motivation:
# We audited the default augmentation settings of YOLOv4/Darknet and
# YOLO26n/Ultralytics. Recent SSS YOLO work reports mosaic augmentation,
# random affine transformations and color jittering, but does not provide exact
# numeric strengths. Therefore, we tune YOLO26n augmentation strength with CV.

imgsz: 640

modes:
  sss_paper_aug:
    mosaic: 1.0
    close_mosaic: 10
    mixup: 0.0
    cutmix: 0.0
    copy_paste: 0.0

    degrees: 0.0
    translate: 0.05
    scale: 0.30
    shear: 0.0
    perspective: 0.0

    fliplr: 0.5
    flipud: 0.0

    hsv_h: 0.0
    hsv_s: 0.20
    hsv_v: 0.20

    bgr: 0.0
    erasing: 0.0

  yolo26n_default:
    mosaic: 1.0
    close_mosaic: 10
    mixup: 0.0
    cutmix: 0.0
    copy_paste: 0.0

    degrees: 0.0
    translate: 0.10
    scale: 0.50
    shear: 0.0
    perspective: 0.0

    fliplr: 0.5
    flipud: 0.0

    hsv_h: 0.015
    hsv_s: 0.70
    hsv_v: 0.40

    bgr: 0.0
    erasing: 0.4

  yolo26n_default_stronger_sss:
    mosaic: 1.0
    close_mosaic: 10
    mixup: 0.0
    cutmix: 0.0
    copy_paste: 0.0

    degrees: 2.0
    translate: 0.12
    scale: 0.65
    shear: 1.0
    perspective: 0.0

    fliplr: 0.5
    flipud: 0.0

    hsv_h: 0.015
    hsv_s: 0.80
    hsv_v: 0.50

    bgr: 0.0
    erasing: 0.4
